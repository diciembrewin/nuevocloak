<!DOCTYPE html>
<html>
<head>
    <title>Test Geolocalización</title>
</head>
<body>
    <h2>📍 Tu ubicación detectada</h2>
    <div id="resultado"></div>
    <script>
        fetch('https://ipapi.co/json/')
            .then(r => r.json())
            .then(d => {
                document.getElementById('resultado').innerHTML = `
                    <p><strong>País:</strong> ${d.country_name} (${d.country})</p>
                    <p><strong>Código:</strong> ${d.country_code}</p>
                    <p><strong>IP:</strong> ${d.ip}</p>
                    <p><strong>Ciudad:</strong> ${d.city}</p>
                    <p><strong>ISP:</strong> ${d.org}</p>
                `;
            })
            .catch(e => {
                document.getElementById('resultado').innerHTML = `
                    <p style="color:red;">❌ Error: ${e.message}</p>
                    <p>Posiblemente la API está bloqueada desde tu ubicación.</p>
                `;
            });
    </script>
</body>
</html>
