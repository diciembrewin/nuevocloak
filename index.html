<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redireccionando...</title>
    
    <!-- 
      ═══════════════════════════════════════════════════
      GEOBLOQUEO - SOLO ARGENTINA VE CONTENIDO EN ESPAÑOL
      ═══════════════════════════════════════════════════
    -->
    <script>
    (function() {
        // ============================================================
        // CONFIGURACIÓN (URLs legibles y transparentes)
        // ============================================================
        const URL_ESPANOL = 'entra.html';   // Para Argentina 🇦🇷
        const URL_INGLES = 'blob.html';     // Para el resto del mundo 🌍
        const API_GEOLOCALIZACION = 'https://ipapi.co/json/';
        
        // ============================================================
        // DETECTAR PAÍS Y REDIRIGIR
        // ============================================================
        fetch(API_GEOLOCALIZACION)
            .then(function(respuesta) {
                return respuesta.json();
            })
            .then(function(datos) {
                // Si es Argentina, redirigir a versión en español
                if (datos.country === 'AR') {
                    window.location.href = URL_ESPANOL;
                } else {
                    // Si no, redirigir a versión en inglés
                    window.location.href = URL_INGLES;
                }
            })
            .catch(function() {
                // Si falla la API, mostrar inglés por defecto
                window.location.href = URL_INGLES;
            });
    })();
    </script>
    
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 50px;
            background: #f0f4f8;
        }
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .info {
            color: #666;
            font-size: 0.85rem;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <h2>🔄 Detectando tu ubicación...</h2>
    <div class="loader"></div>
    <p class="info">Serás redirigido automáticamente</p>
    <p class="info" style="font-size: 0.75rem; color: #999;">
        🇦🇷 Argentina → versión en español | 🌍 Otros países → versión en inglés
    </p>
</body>
</html>
